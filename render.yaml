services:
  - type: web
    name: lumbercorp-companion
    runtime: static
    buildCommand: ""            # no build step — plain static files
    staticPublishPath: ./torn-companion   # folder containing index.html, manifest, sw.js, icons/
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache

  - type: web
    name: lumbercorpedia
    runtime: static
    buildCommand: ""            # no build step — plain static files
    staticPublishPath: ./lumbercorpedia        # the wiki PWA (index.html + data/ + icons/)
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /data/*.js
        name: Cache-Control
        value: public, max-age=300
